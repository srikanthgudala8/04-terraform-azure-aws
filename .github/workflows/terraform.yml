name: Terraform

on:
  pull_request:
    paths: ["**.tf", "**.tftpl", ".github/workflows/terraform.yml"]
  push:
    branches: [main]
    paths: ["**.tf", "**.tftpl"]

permissions:
  contents: read

jobs:
  validate:
    name: fmt, validate, tfsec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: terraform fmt
        run: terraform fmt -check -recursive

      - name: terraform validate (each root module)
        run: |
          for dir in aws/bootstrap aws/envs/dev azure/bootstrap azure/envs/dev; do
            echo "== $dir =="
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done

      - name: Security scan (tfsec)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          soft_fail: true   # report findings without blocking; tighten once triaged

